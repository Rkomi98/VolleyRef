<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;height:100%;background:var(--color-primary-dark);display:flex;align-items:center;justify-content:center;gap:28px}
.mark{width:150px;height:150px;flex-shrink:0}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:104px;color:#fff;letter-spacing:-0.01em}
.strip{flex:1;height:100%;display:flex;flex-direction:column}
.sw{flex:1}
</style></head>
<body>
<div class="main">
<img class="mark" src="assets/mark-light.svg" alt=""/>
<div class="wordmark">VolleyRef</div>
</div>
<div class="strip">
<div class="sw" style="background:#E2A100"></div>
<div class="sw" style="background:#00AAEA"></div>
<div class="sw" style="background:#00A150"></div>
<div class="sw" style="background:#DC1C34"></div>
</div>
</body></html>
