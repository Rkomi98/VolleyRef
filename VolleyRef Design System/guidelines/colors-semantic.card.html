<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success / warning / danger — validation states only, never decorative" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{margin:0;box-sizing:border-box}body{font-family:var(--font-body)}</style></head>
<body>
<div style="padding:20px;display:flex;gap:10px">
<div style="flex:1;min-width:110px;background:#00A150;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#fff">Success</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#fff;opacity:.85">#00A150</div>
  </div>
<div style="flex:1;min-width:110px;background:#E2A100;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#fff">Warning</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#fff;opacity:.85">#E2A100</div>
  </div>
<div style="flex:1;min-width:110px;background:#DC1C34;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#fff">Danger</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#fff;opacity:.85">#DC1C34</div>
  </div>
<div style="flex:1;min-width:110px;background:#E2F6EC;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#00A150">Success subtle</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#00A150;opacity:.85">#E2F6EC</div>
  </div>
<div style="flex:1;min-width:110px;background:#FBF1DA;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#C48B00">Warning subtle</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#C48B00;opacity:.85">#FBF1DA</div>
  </div>
<div style="flex:1;min-width:110px;background:#FCE8EA;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:84px">
    <div style="font-size:12px;font-weight:700;color:#DC1C34">Danger subtle</div>
    <div style="font-size:11px;font-family:var(--font-mono);color:#DC1C34;opacity:.85">#FCE8EA</div>
  </div>
</div></body></html>
