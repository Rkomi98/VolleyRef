<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Background, card surface, and dividing surface tones" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{margin:0;box-sizing:border-box}body{font-family:var(--font-body)}</style></head>
<body>
<div style="padding:20px;display:flex;gap:10px">
<div style="flex:1;background:#F7F9FB;border:1px solid var(--border-default);border-radius:10px;height:84px;display:flex;align-items:flex-end;padding:10px"><div><div style="font-size:12px;font-weight:700;color:#17212B">Background</div><div style="font-size:11px;font-family:var(--font-mono);color:#657381">#F7F9FB</div></div></div>
<div style="flex:1;background:#EDEDED;border-radius:10px;height:84px;display:flex;align-items:flex-end;padding:10px"><div><div style="font-size:12px;font-weight:700;color:#17212B">Surface</div><div style="font-size:11px;font-family:var(--font-mono);color:#657381">#EDEDED</div></div></div>
<div style="flex:1;background:#FFFFFF;border:1px solid var(--border-default);border-radius:10px;height:84px;box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:10px"><div><div style="font-size:12px;font-weight:700;color:#17212B">White / card</div><div style="font-size:11px;font-family:var(--font-mono);color:#657381">#FFFFFF</div></div></div>
</div></body></html>
