<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head><body style="margin:0;background:var(--color-background);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">

const { Tooltip, Dialog, Button } = window.VolleyRefDesignSystem_4fa89f;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:18,alignItems:'flex-start'}}>
      <Tooltip content="Lettura incerta — verifica sul referto"><span style={{padding:'6px 10px',border:'1px dashed var(--neutral-300)',borderRadius:8,fontSize:13}}>Passa il mouse qui</span></Tooltip>
      <Button onClick={()=>setOpen(true)}>Apri dialog</Button>
      <Dialog open={open} onClose={()=>setOpen(false)} title="Esporta analisi" description="Scegli il formato di esportazione."
        footer={<><Button variant="secondary" onClick={()=>setOpen(false)}>Annulla</Button><Button onClick={()=>setOpen(false)}>Scarica Excel</Button></>}>
        <p style={{fontSize:14,color:'var(--color-text-secondary)',margin:0}}>Contenuto di esempio del dialog.</p>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);

</script>
