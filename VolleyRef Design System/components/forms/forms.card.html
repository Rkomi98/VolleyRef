<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="margin:0;background:var(--color-background);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">

const { Input, Select, SegmentedControl } = window.VolleyRefDesignSystem_4fa89f;
function IconSearch(p){return <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" strokeLinecap="round"/></svg>;}
function Demo(){
  const [q,setQ]=React.useState('');
  const [team,setTeam]=React.useState('cerea');
  const [view,setView]=React.useState('table');
  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16,maxWidth:640}}>
      <Input placeholder="Cerca partita…" icon={<IconSearch/>} value={q} onChange={setQ} />
      <Input placeholder="Campo con errore" error value="" onChange={()=>{}} />
      <div style={{display:'flex',gap:12}}>
        <Select style={{flex:1}} options={[{value:'cerea',label:'Isuzu Cerea VR'},{value:'roth',label:'Rothoblaas Volano TN'}]} value={team} onChange={setTeam}/>
        <SegmentedControl options={[{value:'table',label:'Tabella'},{value:'court',label:'Campo'}]} value={view} onChange={setView}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);

</script>
</body></html>
