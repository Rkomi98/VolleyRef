[project]
name = "volleyref-backend"
version = "0.1.0"
description = "VolleyRef backend — trasforma referti PDF di pallavolo in dati strutturati e verificabili"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-magic>=0.4.27",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
